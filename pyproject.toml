[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-ts-lab"
version = "1.0.0"
description = "Auditable monthly temperature anomaly forecasting and statistical inference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "scikit-learn>=1.5", "matplotlib>=3.9", "plotly>=5.20", "fastapi>=0.115", "uvicorn>=0.30", "joblib>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
climate-ts = "climate_ts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climate_ts = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
